g clip-path="url(#clip2--Picture_17--Slide4--1)" transform="matrix(1 0 0 1.00236 -0.5 0)"><use width="100%" height="100%" xlink:href="#img1--Picture_17--Slide4--1" transform="scale(8608.6 8608.6)"></use></g></g><rect x="0" y="0" width="1280" height="67" fill="#8064A2" id="TitlePlaceholder--Slide4--2" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="34" transform="translate(9.6 43)" id="TitlePlaceholder--Slide4--3">Jesus Heals a Paralytic</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1190.37 27)" id="SectionNameTextPlaceholder--Slide4--4">Matthew 9</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7341 195)" id="TextBox_7--Slide4--5">6</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 196)" id="TextBox_8--Slide4--6">But so that you may know that the Son of Man has</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 230)" id="TextBox_8--Slide4--7">authority on</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(199.333 230)" id="TextBox_8--Slide4--8">earth</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(266.833 230)" id="TextBox_8--Slide4--9">to forgive sins</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(424.82 230)" id="TextBox_8--Slide4--10">...”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 263)" id="TextBox_8--Slide4--11">Then</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(115.333 263)" id="TextBox_8--Slide4--12">He said to the paralytic</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(377.127 263)" id="TextBox_8--Slide4--13">,</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(390.46 263)" id="TextBox_8--Slide4--14">“Get up, pick up your</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 297)" id="TextBox_8--Slide4--15">mat, and go home.”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7341 374)" id="TextBox_11--Slide4--16" class="fragment-off" data-fragment-index="1">7</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 377)" id="TextBox_12--Slide4--17" class="fragment-off" data-fragment-index="1">And the man got up and went home.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7341 468)" id="TextBox_13--Slide4--18" class="fragment-off" data-fragment-index="2">8</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 470)" id="TextBox_14--Slide4--19" class="fragment-off" data-fragment-index="2">When the crowds saw this, they were filled with</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 504)" id="TextBox_14--Slide4--20" class="fragment-off" data-fragment-index="2">awe and glorified God</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(302.227 504)" id="TextBox_14--Slide4--21" class="fragment-off" data-fragment-index="2">,</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(315.56 504)" id="TextBox_14--Slide4--22" class="fragment-off" data-fragment-index="2">who had given such</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 537)" id="TextBox_14--Slide4--23" class="fragment-off" data-fragment-index="2">authority to men.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(18.487 709)" id="ReferenceTextPlaceholder--Slide4--24">Matthew 9:6</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(107.34 709)" id="ReferenceTextPlaceholder--Slide4--25">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(115.84 709)" id="ReferenceTextPlaceholder--Slide4--26">8 · Berean Standard Bible (BSB)</text><a id="Narration_Slide4--Slide4--27__LINK" href=""><g clip-path="url(#clip3--Narration_Slide4--Slide4--27)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide4--Slide4--27" style="display:none;"><g clip-path="url(#clip5--Narration_Slide4--Slide4--27)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide4--Slide4--27" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><g clip-path="url(#clip6--Picture_21--Slide4--28)" transform="matrix(0.000104987 0 0 0.000104987 649 109)" id="Picture_21--Slide4--28" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip8--Picture_21--Slide4--28)" transform="matrix(1 0 0 1.00205 -0.5 -0.0625)"><use width="100%" height="100%" xlink:href="#img7--Picture_21--Slide4--28" transform="scale(8594.72 8594.72)"></use></g></g><rect x="649.5" y="108.5" width="619" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide4--29" class="fragment-off" data-fragment-index="2" /><g clip-path="url(#clip9--Picture_19--Slide4--30)" transform="matrix(0.000104987 0 0 0.000104987 648 108)" id="Picture_19--Slide4--30" class="fragment-off" data-fragment-index="2"><g clip-path="url(#clip11--Picture_19--Slide4--30)" transform="matrix(1 0 0 1.00043 -0.5 0)"><use width="100%" height="100%" xlink:href="#img10--Picture_19--Slide4--30" transform="scale(8608.6 8608.6)"></use></g></g></g></svg>