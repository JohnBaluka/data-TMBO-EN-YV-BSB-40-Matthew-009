<p><span id="s15l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">29 </span>Then He touched their eyes and said, <span style="color:#FF2800;">“According to your faith will it be done to you.”</span></span></p><p><span id="s15l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">30 </span>And their eyes were opened. Jesus warned them sternly, <span style="color:#FF2800;">“See that no one finds out about this!”</span></span></p><p><span id="s15l3" class="note-line" data-line="3" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">31 </span>But they went out and spread the news about Him throughout the land.</span></p>
