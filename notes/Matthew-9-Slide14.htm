<p><span class="dmws-comment" data-icon="anchor" data-glyph="⚓" contenteditable="false"><span class="dmws-comment-body">Matthew 9:27–28</span></span></p><p><span id="s14l1" class="note-line" data-line="1" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">27 </span>As Jesus went on from there, two blind men followed Him, crying out, <span style="color:#FF2800;">“Have mercy on us, Son of David!”</span></span></p><p><span id="s14l2" class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video=""><span class="dmws-not-said">28 </span>After Jesus had entered the house, the blind men came to Him. <span style="color:#FF2800;">“Do you believe that I am able to do this?”</span> He asked.</span></p><p><span class="note-line" data-line="2" data-start="" data-end="" data-start-video="" data-end-video="">“Yes, Lord,” they answered.</span></p>
