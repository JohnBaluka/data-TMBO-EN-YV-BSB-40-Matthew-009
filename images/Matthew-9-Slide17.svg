-serif" font-weight="400" font-size="20" transform="translate(44.3578 235)" id="TextBox_7--Slide17--4">35</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4745 242)" id="TextBox_8--Slide17--5">Jesus went through all the towns and villages,</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4745 276)" id="TextBox_8--Slide17--6">teaching in their synagogues, preaching the</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4745 309)" id="TextBox_8--Slide17--7">gospel of the kingdom, and healing every</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4745 343)" id="TextBox_8--Slide17--8">disease and sickness.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(44.3578 389)" id="TextBox_10--Slide17--9" class="fragment-off" data-fragment-index="1">36</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4744 396)" id="TextBox_11--Slide17--10" class="fragment-off" data-fragment-index="1">When He saw the crowds, He was moved with</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4744 430)" id="TextBox_11--Slide17--11" class="fragment-off" data-fragment-index="1">compassion for them, because they were</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4744 463)" id="TextBox_11--Slide17--12" class="fragment-off" data-fragment-index="1">harassed and helpless, like sheep without a</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(75.4744 497)" id="TextBox_11--Slide17--13" class="fragment-off" data-fragment-index="1">shepherd.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="tran