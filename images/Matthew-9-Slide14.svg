rif" font-weight="400" font-size="20" transform="translate(69.1428 253)" id="TextBox_7--Slide14--4">27</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 260)" id="TextBox_8--Slide14--5">As Jesus went on from there, two blind men</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 294)" id="TextBox_8--Slide14--6">followed Him, crying out,</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(392.2 294)" id="TextBox_8--Slide14--7">“Have mercy on</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 327)" id="TextBox_8--Slide14--8">us, Son of David!”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(70.9067 378)" id="TextBox_10--Slide14--9" class="fragment-off" data-fragment-index="1">28</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 383)" id="TextBox_11--Slide14--10" class="fragment-off" data-fragment-index="1">After Jesus had entered the house, the blind</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 417)" id="TextBox_11--Slide14--11" class="fragment-off" data-fragment-index="1">men came to Him.</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(314.827 417)" id="TextBox_11--Slide14--12" class="fragment-off" data-fragment-index="1">“Do you believe that I am</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 450)" id="TextBox_11--Slide14--13" class="fragment-off" data-fragment-index="1">able to do this?”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(293.873 450)" id="TextBox_11--Slide14--14" class="fragment-off" data-fragment-index="1">He asked. “Yes, Lord,” they</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 484)" id="TextBox_11--Slide14--15" class="fragment-off" data-fragment-index="1">answered.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide14--16">Matthew 9:27</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide14--17">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide14--18">28 · Berean Standard Bible (BSB)</text><rect x="649.5" y="116.5" width="619" height="519" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide14--19" /><g clip-path="url(#clip0--Picture_18--Slide14--20)" transform="matrix(0.000104987 0 0 0.000104987 649 116)" id="Picture_18--Slide14--20"><g clip-path="url(#clip2--Picture_18--Slide14--20)" transform="matrix(1 0 0 1.00043 -0.5 0)"><use width="100%" height="100%" xlink:href="#img1--Picture_18--Slide14--20" transform="scale(8608.6 8608.6)"></use></g></g><g clip-path="url(#clip3--Picture_20--Slide14--21)" transform="matrix(0.000104987 0 0 0.000104987 648 116)" id="Picture_20--Slide14--21" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip5--Picture_20--Slide14--21)" transform="matrix(1.00103 0 0 1 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_20--Slide14--21" transform="scale(8612.33 8612.33)"></use></g></g><a id="Narration_Slide14--Slide14--22__LINK" href=""><g clip-path="url(#clip6--Narration_Slide14--Slide14--22)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide14--Slide14--22" style="display:none;"><g clip-path="url(#clip8--Narration_Slide14--Slide14--22)"><use width="100%" height="100%" xlink:href="#img7--Narration_Slide14--Slide14--22" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>