rm="translate(67.5933 299)" id="TextBox_7--Slide15--5">29</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 298)" id="TextBox_8--Slide15--6">Then He touched their eyes and said,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 334)" id="TextBox_9--Slide15--7">“According to your faith will it be done to you.”</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 385)" id="TextBox_10--Slide15--8" class="fragment-off" data-fragment-index="1">30</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 384)" id="TextBox_11--Slide15--9" class="fragment-off" data-fragment-index="1">And their eyes were opened. Jesus warned them sternly,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 420)" id="TextBox_12--Slide15--10" class="fragment-off" data-fragment-index="1">“See that no one finds out about this!”</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 471)" id="TextBox_13--Slide15--11" class="fragment-off" data-fragment-index="2">31</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 470)" id="TextBox_14--Slide15--12" class="fragment-off" data-fragment-index="2">But they went out and spread the news about Him throughout the land.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide15--13">Matthew 9:29</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide15--14">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide15--15">31 · Berean Standard Bible (BSB)</text><a id="Narration_Slide15--Slide15--16__LINK" href=""><g clip-path="url(#clip3--Narration_Slide15--Slide15--16)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide15--Slide15--16" style="display:none;"><g clip-path="url(#clip5--Narration_Slide15--Slide15--16)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide15--Slide15--16" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>