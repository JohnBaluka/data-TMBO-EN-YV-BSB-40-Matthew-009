to,sans-serif" font-weight="400" font-size="20" transform="translate(58.8411 247)" id="TextBox_7--Slide15--4">29</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 246)" id="TextBox_8--Slide15--5">Then He touched their eyes and said,</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 280)" id="TextBox_8--Slide15--6">“According to your faith will it be done to</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 313)" id="TextBox_8--Slide15--7">you.”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(58.8411 359)" id="TextBox_10--Slide15--8" class="fragment-off" data-fragment-index="1">30</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 358)" id="TextBox_11--Slide15--9" class="fragment-off" data-fragment-index="1">And their eyes were opened. Jesus warned</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 392)" id="TextBox_11--Slide15--10" class="fragment-off" data-fragment-index="1">them sternly, “See that no one finds out about</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 425)" id="TextBox_11--Slide15--11" class="fragment-off" data-fragment-index="1">this!”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(58.8411 471)" id="TextBox_13--Slide15--12" class="fragment-off" data-fragment-index="2">31</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 470)" id="TextBox_14--Slide15--13" class="fragment-off" data-fragment-index="2">But they went out and spread the news about</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(91.2063 504)" id="TextBox_14--Slide15--14" class="fragment-off" data-fragment-index="2">Him throughout the land.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide15--15">Matthew 9:29</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide15--16">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide15--17">31 · Berean Standard Bible (BSB)</text><a id="Narration_Slide15--Slide15--18__LINK" href=""><g clip-path="url(#clip0--Narration_Slide15--Slide15--18)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide15--Slide15--18" style="display:none;"><g clip-path="url(#clip2--Narration_Slide15--Slide15--18)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide15--Slide15--18" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="649.5" y="116.5" width="619" height="519" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide15--19" /><g clip-path="url(#clip3--Picture_17--Slide15--20)" transform="matrix(0.000104987 0 0 0.000104987 649 115)" id="Picture_17--Slide15--20"><g clip-path="url(#clip5--Picture_17--Slide15--20)" transform="matrix(1 0 0 1.00236 -0.5 -0.125)"><use width="100%" height="100%" xlink:href="#img4--Picture_17--Slide15--20" transform="scale(8608.6 8608.6)"></use></g></g><g clip-path="url(#clip6--Picture_19--Slide15--21)" transform="matrix(0.000104987 0 0 0.000104987 648 115)" id="Picture_19--Slide15--21" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip8--Picture_19--Slide15--21)" transform="matrix(1 0 0 1.00043 -0.5 -0.125)"><use width="100%" height="100%" xlink:href="#img7--Picture_19--Slide15--21" transform="scal