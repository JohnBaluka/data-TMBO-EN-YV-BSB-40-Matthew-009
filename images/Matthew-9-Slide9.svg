@font-face{font-family:'Carlito';src:url('fonts/Carlito-bold-italic.ttf') format('truetype');font-weight:bold;font-style:italic;font-display:swap;}]]></style><clipPath id="clip0--Narration_Slide21--Slide21--19"><rect x="0" y="0" width="609600" height="609600" /></clipPath><image width="64" height="64" xlink:href="images/Matthew-9-Slide9--img1--Narration_Slide21--Slide21--19.png" preserveAspectRatio="none" id="img1--Narration_Slide21--Slide21--19"></image><clipPath id="clip2--Narration_Slide21--Slide21--19"><rect x="-1" y="-0.5" width="609600" height="609600" /></clipPath><image width="512" height="768" xlink:href="images/Matthew-9-Slide9--img3--ViewBox_DUP2--Slide21--20.jpg" preserveAspectRatio="none" id="img3--ViewBox_DUP2--Slide21--20"></image><clipPath id="clip4--ViewBox_DUP2--Slide21--20"><rect x="0" y="0" width="3302000" height="4953000" /></clipPath></defs><g id="gSlide--Slide21"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" id="rectSlide--Slide21--0" /><rect x="0" y="0" width="1280" height="67" fill="#7030A0" id="TitlePlaceholder--Slide21--1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="34" transform="translate(9.6 43)" id="TitlePlaceholder--Slide21--2">The Patches and the Wineskins</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1190.37 27)" id="SectionNameTextPlaceholder--Slide21--3">Matthew 9</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(42.9237 179)" id="TextBox_7--Slide21--4">16</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(42.9237 342)" id="TextBox_10--Slide21--5" class="fragment-off" data-fragment-index="1">17</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 186)" id="TextBox_8--Slide21--6">No one sews a patch of unshrunk cloth on</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 220)" id="TextBox_8--Slide21--7">an old garment. For the patch will pull</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 253)" id="TextBox_8--Slide21--8">away from the garment, and a worse tear</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 287)" id="TextBox_8--Slide21--9">will result.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 349)" id="TextBox_11--Slide21--10" class="fragment-off" data-fragment-index="1">Neither do men pour new wine into old</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 383)" id="TextBox_11--Slide21--11" class="fragment-off" data-fragment-index="1">wineskins. If they do, the skins will burst, the</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 416)" id="TextBox_11--Slide21--12" class="fragment-off" data-fragment-index="1">wine will spill, and the wineskins will be</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 450)" id="TextBox_11--Slide21--13" class="fragment-off" data-fragment-index="1">ruined. Instead, they pour new wine into</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.2183 484)" id="TextBox_11--Slide21--14" class="fragment-off" data-fragment-index="1">new wineskins, and both are preserved.”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide21--15">Matthew 9:16</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide21--16">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide21--17">17 · Berean Standard Bible (BSB)</text><rect x="617.5" y="117.5" width="620" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide21--18" /><a id="Narration_Slide21--Slide21--19__LINK" href=""><g clip-path="url(#clip0--Narration_Slide21--Slide21--19)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide21--Slide21--19" style="display:none;"><g clip-path="url(#clip2--Narration_Slide21--Slide21--19)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide21--Slide21--19" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><g transform="matrix(0.000104987 0 0 0.000104987 617.5 117.5)" id="ViewBox_DUP2--Slide21--20"><g clip-path="url(#clip4--ViewBox_DUP2--Slide21--20)" transform="matrix(1.78846 0 0 1 -0.41864 -0.11631)"><use width="100%" height="100%" xlink:href="#img3--ViewBox_DUP2--Slide21--20" transform="scale(6449.22 6449.22)"></use></g></g><rect x="617.5" y="117.5" width="620" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="TMP-rect--21" /></g></svg>