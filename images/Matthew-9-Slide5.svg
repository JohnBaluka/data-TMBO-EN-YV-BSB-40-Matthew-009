ansform="translate(68.2582 477)" id="TextBox_11--Slide6--15" class="fragment-off" data-fragment-index="1">collectors and sinners?”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide6--16">Matthew 9:10</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide6--17">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide6--18">11 · Berean Standard Bible (BSB)</text><a id="Narration_Slide6--Slide6--19__LINK" href=""><g clip-path="url(#clip0--Narration_Slide6--Slide6--19)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide6--Slide6--19" style="display:none;"><g clip-path="url(#clip2--Narration_Slide6--Slide6--19)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide6--Slide6--19" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="649.5" y="108.5" width="619" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide6--20" /><g clip-path="url(#clip3--Picture_15--Slide6--21)" transform="matrix(0.000104987 0 0 0.000104987 649 108)" id="Picture_15--Slide6--21"><g clip-path="url(#clip5--Picture_15--Slide6--21)" transform="matrix(1 0 0 1.00252 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_15--Slide6--21" transform="scale(8607.26 8607.26)"></use></g></g><g clip-path="url(#clip6--Picture_17--Slide6--22)" transform="matrix(0.000104987 0 0 0.000104987 649 108)" id="Picture_17--Slide6--22" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip8--Picture_17--Slide6--22)" transform="matrix(1 0 0 1.00205 -0.5 0)"><use width="100%" height="100%" xlink:href="#img7--Picture_17--Slide6--22" transform="scale(8594.72 8594.72)"></use>