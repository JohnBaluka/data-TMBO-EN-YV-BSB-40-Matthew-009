e="20" transform="translate(33.2123 146)" id="TextBox_7--Slide3--4">3</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 145)" id="TextBox_8--Slide3--5">On seeing this, some of the scribes said to</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 179)" id="TextBox_8--Slide3--6">themselves, “This man is blaspheming!”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(33.2123 265)" id="TextBox_9--Slide3--7" class="fragment-off" data-fragment-index="1">4</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 264)" id="TextBox_10--Slide3--8" class="fragment-off" data-fragment-index="1">But Jesus knew what they were thinking</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 298)" id="TextBox_10--Slide3--9" class="fragment-off" data-fragment-index="1">and said, “Why do you harbor evil in your</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 331)" id="TextBox_10--Slide3--10" class="fragment-off" data-fragment-index="1">hearts?</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(33.2123 410)" id="TextBox_12--Slide3--11" class="fragment-off" data-fragment-index="2">5</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 409)" id="TextBox_13--Slide3--12" class="fragment-off" data-fragment-index="2">Which is easier: to say, ‘Your sins are</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(55.4782 443)" id="TextBox_13--Slide3--13" class="fragment-off" data-fragment-index="2">forgiven,’ or to say, ‘Get up and walk’?</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide3--14">Matthew 9:3</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(105.253 710)" id="ReferenceTextPlaceholder--Slide3--15">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.753 710)" id="ReferenceTextPlaceholder--Slide3--16">5 · Berean Standard Bible (BSB)</text><a id="Narration_Slide3--Slide3--17__LINK" href=""><g clip-path="url(#clip0--Narration_Slide3--Slide3--17)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide3--Slide3--17" style="display:none;"><g clip-path="url(#clip2--Narration_Slide3--Slide3--17)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide3--Slide3--17" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><g clip-path="url(#clip3--Picture_15--Slide3--18)" transform="matrix(0.000104987 0 0 0.000104987 570 94)" id="Picture_15--Slide3--18"><g clip-path="url(#clip5--Picture_15--Slide3--18)" transform="matrix(1.00083 0 0 1 -0.5 -0.0625)"><use width="100%" height="100%" xlink:href="#img4--Picture_15--Slide3--18" transform="scale(9392.25 9392.25)"></use></g></g><g clip-path="url(#clip6--Picture_17--Slide3--19)" transform="matrix(0.000104987 0 0 0.000104987 570 94)" id="Picture_17--Slide3--19" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip8--Picture_17--Slide3--19)" transform="matrix(1.00083 0 0 1 -0.5 -0.0625)"><use width="100%" height="100%" xlink:href="#img7--Picture_17--Slide3--19" transform="scale(9392.25 9392.25)"></use></g></g><rect x="570.5" y="94.5001" width="677" height="566" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide3--20" class="fragment-off" data-fragment-index="2" /></g></svg>