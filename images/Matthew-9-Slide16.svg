ansform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide17--15">36 · Berean Standard Bible (BSB)</text><a id="Narration_Slide17--Slide17--16__LINK" href=""><g clip-path="url(#clip3--Narration_Slide17--Slide17--16)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide17--Slide17--16" style="display:none;"><g clip-path="url(#clip5--Narration_Slide17--Slide17--16)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide17--Slide17--16" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>