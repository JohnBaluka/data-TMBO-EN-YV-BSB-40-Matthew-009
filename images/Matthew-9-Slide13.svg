rm="translate(67.5933 305)" id="TextBox_7--Slide14--5">27</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 304)" id="TextBox_8--Slide14--6">As Jesus went on from there, two blind men followed Him, crying out,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 340)" id="TextBox_9--Slide14--7">“Have mercy on us, Son of David!”</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 391)" id="TextBox_10--Slide14--8" class="fragment-off" data-fragment-index="1">28</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 390)" id="TextBox_11--Slide14--9" class="fragment-off" data-fragment-index="1">After Jesus had entered the house, the blind men came to Him. “Do you believe</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 426)" id="TextBox_12--Slide14--10" class="fragment-off" data-fragment-index="1">that I am able to do this?” He asked.</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 462)" id="TextBox_13--Slide14--11" class="fragment-off" data-fragment-index="1">“Yes, Lord,” they answered.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide14--12">Matthew 9:27</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide14--13">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide14--14">28 · Berean Standard Bible (BSB)</text><a id="Narration_Slide14--Slide14--15__LINK" href=""><g clip-path="url(#clip3--Narration_Slide14--Slide14--15)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide14--Slide14--15" style="display:none;"><g clip-path="url(#clip5--Narration_Slide14--Slide14--15)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide14--Slide14--15" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>