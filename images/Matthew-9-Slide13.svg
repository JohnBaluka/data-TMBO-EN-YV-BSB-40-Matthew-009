to,sans-serif" font-weight="400" font-size="20" transform="translate(67.6348 261)" id="TextBox_7--Slide14--4">27</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 260)" id="TextBox_8--Slide14--5">As Jesus went on from there, two blind men</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 294)" id="TextBox_8--Slide14--6">followed Him, crying out</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(378.867 294)" id="TextBox_8--Slide14--7">,</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(392.2 294)" id="TextBox_8--Slide14--8">“Have mercy on</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 327)" id="TextBox_8--Slide14--9">us, Son of David!”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.6348 384)" id="TextBox_10--Slide14--10" class="fragment-off" data-fragment-index="1">28</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 383)" id="TextBox_11--Slide14--11" class="fragment-off" data-fragment-index="1">After Jesus had entered the house, the blind</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 417)" id="TextBox_11--Slide14--12" class="fragment-off" data-fragment-index="1">men came to Him. “Do you</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(413 417)" id="TextBox_11--Slide14--13" class="fragment-off" data-fragment-index="1">believe</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(501.253 417)" id="TextBox_11--Slide14--14" class="fragment-off" data-fragment-index="1">that I am</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 450)" id="TextBox_11--Slide14--15" class="fragment-off" data-fragment-index="1">able to do this?” He asked</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(396.473 450)" id="TextBox_11--Slide14--16" class="fragment-off" data-fragment-index="1">.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(409.807 450)" id="TextBox_11--Slide14--17" class="fragment-off" data-fragment-index="1">“Yes, Lord,” they</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 484)" id="TextBox_11--Slide14--18" class="fragment-off" data-fragment-index="1">answered.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide14--19">Matthew 9:27</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide14--20">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide14--21">28 · Berean Standard Bible (BSB)</text><a id="Narration_Slide14--Slide14--22__LINK" href=""><g clip-path="url(#clip0--Narration_Slide14--Slide14--22)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide14--Slide14--22" style="display:none;"><g clip-path="url(#clip2--Narration_Slide14--Slide14--22)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide14--Slide14--22" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="649.5" y="116.5" width="619" height="519" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide14--23" /><g clip-path="url(#clip3--Picture_18--Slide14--24)" transform="matrix(0.000104987 0 0 0.000104987 649 116)" id="Picture_18--Slide14--24"><g clip-path="url(#clip5--Picture_18--Slide14--24)" transform="matrix(1 0 0 1.00043 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_18--Slide14--24" transform="scale(8608.6 8608.6)"></use></g></g><g clip-path="url(#clip6--Picture_20--Slide14--25)" transform="matrix(0.000104987 0 0 0.000104987 648 116)" id="Picture_20--Slide14--25" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip8--Picture_20--Slide14--25)" transform="matrix(1.00103 0 0 1 -0.5 0)"><use width="100%" height="100%" xlink:href="#img7--Picture_20--Slide14--25" transform="scale(8612.33 8612.33)"></use></g></g></g></svg>