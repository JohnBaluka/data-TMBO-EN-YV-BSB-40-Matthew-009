@font-face{font-family:'Carlito';src:url('fonts/Carlito-bold-italic.ttf') format('truetype');font-weight:bold;font-style:italic;font-display:swap;}]]></style><image width="1370" height="1148" xlink:href="images/Matthew-9-Slide11--img0--Picture_15--Slide11--16.jpg" preserveAspectRatio="none" id="img0--Picture_15--Slide11--16"></image><clipPath id="clip1--Picture_15--Slide11--16"><rect x="0" y="0" width="6797432" height="5695950" /></clipPath><image width="1370" height="1148" xlink:href="images/Matthew-9-Slide11--img2--Picture_18--Slide11--18.jpg" preserveAspectRatio="none" id="img2--Picture_18--Slide11--18"></image><clipPath id="clip3--Picture_18--Slide11--18"><rect x="0" y="0" width="6797432" height="5695950" /></clipPath><image width="1370" height="1148" xlink:href="images/Matthew-9-Slide11--img4--Picture_20--Slide11--19.jpg" preserveAspectRatio="none" id="img4--Picture_20--Slide11--19"></image><clipPath id="clip5--Picture_20--Slide11--19"><rect x="0" y="0" width="6797432" height="5695950" /></clipPath><image width="1371" height="1148" xlink:href="images/Matthew-9-Slide11--img6--Picture_7--Slide11--26.jpg" preserveAspectRatio="none" id="img6--Picture_7--Slide11--26"></image><clipPath id="clip7--Picture_7--Slide11--26"><rect x="0" y="0" width="6800850" height="5694658" /></clipPath><clipPath id="clip8--Narration_Slide11--Slide11--27"><rect x="0" y="0" width="609600" height="609600" /></clipPath><image width="64" height="64" xlink:href="images/Matthew-9-Slide11--img9--Narration_Slide11--Slide11--27.png" preserveAspectRatio="none" id="img9--Narration_Slide11--Slide11--27"></image><clipPath id="clip10--Narration_Slide11--Slide11--27"><rect x="-1" y="-0.5" width="609600" height="609600" /></clipPath></defs><g id="gSlide--Slide11"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" id="rectSlide--Slide11--0" /><rect x="0" y="0" width="1280" height="67" fill="#7030A0" id="TitlePlaceholder--Slide11--1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="42.6667" transform="translate(9.6 46)" id="TitlePlaceholder--Slide11--2">The Healing Touch of Jesus</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1190.37 27)" id="SectionNameTextPlaceholder--Slide11--3">Matthew 9</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(22.4587 135)" id="TextBox_7--Slide11--4">20</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.824 142)" id="TextBox_8--Slide11--5">Suddenly a woman who had suffered from</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.824 176)" id="TextBox_8--Slide11--6">bleeding for twelve years came up behind</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.824 209)" id="TextBox_8--Slide11--7">Him and touched the fringe of His cloak.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(22.4587 285)" id="TextBox_10--Slide11--8" class="fragment-off" data-fragment-index="1">21</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 294)" id="TextBox_11--Slide11--9" class="fragment-off" data-fragment-index="1">She said to herself, “If only I touch His</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 328)" id="TextBox_11--Slide11--10" class="fragment-off" data-fragment-index="1">cloak, I will be healed.”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(25.215 403)" id="TextBox_12--Slide11--11" class="fragment-off" data-fragment-index="2">22</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 410)" id="TextBox_13--Slide11--12" class="fragment-off" data-fragment-index="2">Jesus turned and saw her.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide11--13">Matthew 9:20</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide11--14">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide11--15">22 · Berean Standard Bible (BSB)</text><g transform="matrix(0.000104987 0 0 0.000104987 551 78)" id="Picture_15--Slide11--16"><g clip-path="url(#clip1--Picture_15--Slide11--16)" transform="scale(1.0005 1)"><use width="100%" height="100%" xlink:href="#img0--Picture_15--Slide11--16" transform="scale(4961.63 4961.63)"></use></g></g><rect x="551.5" y="78.5001" width="714" height="598" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide11--17" /><g transform="matrix(0.000104987 0 0 0.000104987 551 78)" id="Picture_18--Slide11--18" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip3--Picture_18--Slide11--18)" transform="scale(1.0005 1)"><use width="100%" height="100%" xlink:href="#img2--Picture_18--Slide11--18" transform="scale(4961.63 4961.63)"></use></g></g><g transform="matrix(0.000104987 0 0 0.000104987 551 78)" id="Picture_20--Slide11--19" class="fragment-off" data-fragment-index="2"><g clip-path="url(#clip5--Picture_20--Slide11--19)" transform="scale(1.0005 1)"><use width="100%" height="100%" xlink:href="#img4--Picture_20--Slide11--19" transform="scale(4961.63 4961.63)"></use></g></g><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 450)" id="TextBox_13_DUP2--Slide11--20" class="fragment-off" data-fragment-index="3">“Take courage, daughter,”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(352.397 450)" id="TextBox_13_DUP2--Slide11--21" class="fragment-off" data-fragment-index="3">He said,</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(449.064 450)" id="TextBox_13_DUP2--Slide11--22" class="fragment-off" data-fragment-index="3">“your</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 484)" id="TextBox_13_DUP2--Slide11--23" class="fragment-off" data-fragment-index="3">faith has healed you.”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(306.564 484)" id="TextBox_13_DUP2--Slide11--24" class="fragment-off" data-fragment-index="3">And the woman was</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(54.8239 517)" id="TextBox_13_DUP2--Slide11--25" class="fragment-off" data-fragment-index="3">healed from that very hour.</text><g transform="matrix(0.000104987 0 0 0.000104987 551 78)" id="Picture_7--Slide11--26" class="fragment-off" data-fragment-index="3"><g clip-path="url(#clip7--Picture_7--Slide11--26)" transform="scale(1 1.00023)"><use width="100%" height="100%" xlink:href="#img6--Picture_7--Slide11--26" transform="scale(4960.5 4960.5)"></use></g></g><a id="Narration_Slide11--Slide11--27__LINK" href=""><g clip-path="url(#clip8--Narration_Slide11--Slide11--27)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide11--Slide11--27" style="display:none;"><g clip-path="url(#clip10--Narration_Slide11--Slide11--27)"><use width="100%" height="100%" xlink:href="#img9--Narration_Slide11--Slide11--27" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>