anslate(16.4334 708)" id="ReferenceTextPlaceholder--Slide23--5">Matthew 9: · Berean Standard Bible (BSB)</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(15.8664 265)" id="TextBox_6--Slide23--6">This chapter reveals the authority and</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(15.8664 299)" id="TextBox_6--Slide23--7">love of Jesus in everyday places.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(15.8665 371)" id="TextBox_6_DUP2--Slide23--8" class="fragment-off" data-fragment-index="1">As we begin Chapter 9, we’ll see the</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(15.8665 405)" id="TextBox_6_DUP2--Slide23--9" class="fragment-off" data-fragment-index="1">Kingdom of Heaven at work through</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(15.8665 438)" id="TextBox_6_DUP2--Slide23--10" class="fragment-off" data-fragment-index="1">Jesus’s teaching, healing, and calling.</text><rect x="483.5" y="156.5" width="763" height="429" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide23--11" /><a id="Narration_Slide23--Slide23--12__LINK" href=""><g clip-path="url(#clip3--Narration_Slide23--Slide23--12)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide23--Slide23--12" style="display:none;"><g clip-path="url(#clip5--Narration_Slide23--Slide23--12)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide23--Slide23--12" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>