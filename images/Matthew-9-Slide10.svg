ht="400" font-size="20" transform="translate(67.6348 219)" id="TextBox_7--Slide10--4">18</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 227)" id="TextBox_8--Slide10--5">While Jesus was saying these things, a</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 261)" id="TextBox_8--Slide10--6">synagogue leader came and knelt before</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 294)" id="TextBox_8--Slide10--7">Him. “My daughter has just died,” he said.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 328)" id="TextBox_8--Slide10--8">“But come and place Your hand on her, and</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 362)" id="TextBox_8--Slide10--9">she will live.”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.6348 431)" id="TextBox_11--Slide10--10" class="fragment-off" data-fragment-index="1">19</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 444)" id="TextBox_12--Slide10--11" class="fragment-off" data-fragment-index="1">So</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(134 444)" id="TextBox_12--Slide10--12" class="fragment-off" data-fragment-index="1">Jesus got up and went with him, along</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 478)" id="TextBox_12--Slide10--13" class="fragment-off" data-fragment-index="1">with His disciples.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide10--14">Matthew 9:18</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide10--15">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide10--16">19 · Berean Standard Bible (BSB)</text><rect x="649.5" y="114.5" width="619" height="519" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide10--17" /><g clip-path="url(#clip0--Picture_15--Slide10--18)" transform="matrix(0.000104987 0 0 0.000104987 649 114)" id="Picture_15--Slide10--18"><g clip-path="url(#clip2--Picture_15--Slide10--18)" transform="matrix(1 0 0 1.00205 -0.5 0)"><use width="100%" height="100%" xlink:href="#img1--Picture_15--Slide10--18" transform="scale(8594.72 8594.72)"></use></g></g><g clip-path="url(#clip3--Picture_17--Slide10--19)" transform="matrix(0.000104987 0 0 0.000104987 649 114)" id="Picture_17--Slide10--19" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip5--Picture_17--Slide10--19)" transform="matrix(1 0 0 1.00077 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_17--Slide10--19" transform="scale(8607.26 8607.26)"></use></g></g><a id="Narration_Slide10--Slide10--20__LINK" href=""><g clip-path="url(#clip6--Narration_Slide10--Slide10--20)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide10--Slide10--20" style="display:none;"><g clip-path="url(#clip8--Narration_Slide10--Slide10--20)"><use width="100%" height="100%" xlink:href="#img7--Narration_Slide10--Slide10--20" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>