ansform="translate(42.8731 257)" id="TextBox_7--Slide7--4">12</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.129 264)" id="TextBox_8--Slide7--5">On hearing this, Jesus said,</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(383.796 264)" id="TextBox_8--Slide7--6">“It is not the</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.129 298)" id="TextBox_8--Slide7--7">healthy who need a doctor, but the sick.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(39.6706 384)" id="TextBox_9--Slide7--8" class="fragment-off" data-fragment-index="1">13</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.129 392)" id="TextBox_10--Slide7--9" class="fragment-off" data-fragment-index="1">But go and learn what this means: ‘I desire</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.129 426)" id="TextBox_10--Slide7--10" class="fragment-off" data-fragment-index="1">mercy, not sacrifice.’ For I have not come to call</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.129 459)" id="TextBox_10--Slide7--11" class="fragment-off" data-fragment-index="1">the righteous, but sinners.”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide7--12">Matthew 9:12</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide7--13">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide7--14">13 · Berean Standard Bible (BSB)</text><rect x="649.5" y="108.5" width="619" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide7--15" /><g clip-path="url(#clip0--Picture_14--Slide7--16)" transform="matrix(0.000104987 0 0 0.000104987 649 108)" id="Picture_14--Slide7--16"><g clip-path="url(#clip2--Picture_14--Slide7--16)" transform="matrix(1 0 0 1.00236 -0.5 0)"><use width="100%" height="100%" xlink:href="#img1--Picture_14--Slide7--16" transform="scale(8608.6 8608.6)"></use></g></g><g clip-path="url(#clip3--Picture_16--Slide7--17)" transform="matrix(0.000104987 0 0 0.000104987 648 108)" id="Picture_16--Slide7--17" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip5--Picture_16--Slide7--17)" transform="matrix(1 0 0 1.00236 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_16--Slide7--17" transform="scale(8608.6 8608.6)"></use></g></g><a id="Narration_Slide7--Slide7--18__LINK" href=""><g clip-path="url(#clip6--Narration_Slide7--Slide7--18)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide7--Slide7--18" style="display:none;"><g clip-path="url(#clip8--Narration_Slide7--Slide7--18)"><use width="100%" height="100%" xlink:href="#img7--Narration_Slide7--Slide7--18" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>