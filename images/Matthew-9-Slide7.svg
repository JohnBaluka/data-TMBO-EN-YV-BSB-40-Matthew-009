anslate(560.014 290)" id="TextBox_8--Slide22--6">Then John’s disciples came to Jesus and asked,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(560.014 324)" id="TextBox_8--Slide22--7">“Why is it that we and the Pharisees fast so often,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(560.014 357)" id="TextBox_8--Slide22--8">but Your disciples do not fast?”</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="20" transform="translate(530.196 418)" id="TextBox_10--Slide22--9" class="fragment-off" data-fragment-index="1">15</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(556.258 421)" id="TextBox_11--Slide22--10" class="fragment-off" data-fragment-index="1">Jesus replied, “How can the guests of the</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(556.258 455)" id="TextBox_11--Slide22--11" class="fragment-off" data-fragment-index="1">bridegroom mourn while He is with them? But the</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(556.258 488)" id="TextBox_11--Slide22--12" class="fragment-off" data-fragment-index="1">time will come when the bridegroom will be taken</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(556.258 522)" id="TextBox_11--Slide22--13" class="fragment-off" data-fragment-index="1">from them; then they will fast.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide22--14">Matthew 9:14</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide22--15">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide22--16">15 · Berean Standard Bible (BSB)</text><rect x="16.5001" y="79.5001" width="1244" height="596" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide22--17" /><a id="Narration_Slide22--Slide22--18__LINK" href=""><g clip-path="url(#clip2--Narration_Slide22--Slide22--18)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide22--Slide22--18" style="display:none;"><g clip-path="url(#clip4--Narration_Slide22--Slide22--18)"><use width="100%" height="100%" xlink:href="#img3--Narration_Slide22--Slide22--18" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>