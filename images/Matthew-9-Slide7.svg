="TextBox_7--Slide8--5">14</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 304)" id="TextBox_8--Slide8--6">Then John’s disciples came to Jesus and asked, “Why is it that we and the</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 340)" id="TextBox_9--Slide8--7">Pharisees fast so often, but Your disciples do not fast?”</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 391)" id="TextBox_10--Slide8--8" class="fragment-off" data-fragment-index="1">15</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 390)" id="TextBox_11--Slide8--9" class="fragment-off" data-fragment-index="1">Jesus replied, “How can the guests of the bridegroom mourn while He is with</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 426)" id="TextBox_12--Slide8--10" class="fragment-off" data-fragment-index="1">them? But the time will come when the bridegroom will be taken from them;</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 462)" id="TextBox_13--Slide8--11" class="fragment-off" data-fragment-index="1">then they will fast.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide8--12">Matthew 9:14</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide8--13">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide8--14">15 · Berean Standard Bible (BSB)</text><a id="Narration_S