" font-weight="400" font-size="28" transform="translate(72.1756 288)" id="TextBox_8--Slide22--7">often, but Your disciples do not fast?”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(42.9237 360)" id="TextBox_10--Slide22--8" class="fragment-off" data-fragment-index="1">15</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.1756 368)" id="TextBox_11--Slide22--9" class="fragment-off" data-fragment-index="1">Jesus replied, “How can the guests of the</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.1756 402)" id="TextBox_11--Slide22--10" class="fragment-off" data-fragment-index="1">bridegroom mourn while He is with</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.1756 435)" id="TextBox_11--Slide22--11" class="fragment-off" data-fragment-index="1">them? But the time will come when the</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.1756 469)" id="TextBox_11--Slide22--12" class="fragment-off" data-fragment-index="1">bridegroom will be taken from them; then</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(72.1756 503)" id="TextBox_11--Slide22--13" class="fragment-off" data-fragment-index="1">they will fast.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide22--14">Matthew 9:14</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide22--15">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceT