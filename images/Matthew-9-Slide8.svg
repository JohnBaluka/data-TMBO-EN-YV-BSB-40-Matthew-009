nsform="translate(700.295 146)" id="TextBox_7--Slide21--5">16</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="20" transform="translate(710.561 311)" id="TextBox_10--Slide21--6" class="fragment-off" data-fragment-index="1">17</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(730.926 153)" id="TextBox_8--Slide21--7">No one sews a patch of unshrunk cloth</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(730.926 187)" id="TextBox_8--Slide21--8">on an old garment. For the patch will pull</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(730.926 220)" id="TextBox_8--Slide21--9">away from the garment, and a worse tear</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(730.926 254)" id="TextBox_8--Slide21--10">will result.</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(738.321 318)" id="TextBox_11--Slide21--11" class="fragment-off" data-fragment-index="1">Neither do men pour new wine into old</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(738.321 352)" id="TextBox_11--Slide21--12" class="fragment-off" data-fragment-index="1">wineskins. If they do, the skins will burst,</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(738.321 385)" id="TextBox_11--Slide21--13" class="fragment-off" data-fragment-index="1">the wine will spill, and the wineskins will be</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(738.321 419)" id="TextBox_11--Slide21--14" class="fragment-off" data-fragment-index="1">ruined. Instead, they pour new wine into</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="700" font-size="28" transform="translate(738.321 453)" id="TextBox_11--Slide21--15" class="fragment-off" data-fragment-index="1">new wineskins, and both are preserved.”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide21--16">Matthew 9:16</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide21--17">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide21--18">17 · Berean Standard Bible (BSB)</text><a id="Narration_Slide9--Slide21--19__LINK" href=""><g clip-path="url(#clip3--Narration_Slide9--Slide21--19)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide9--Slide21--19" style="display:none;"><g clip-path="url(#clip5--Narration_Slide9--Slide21--19)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide9--Slide21--19" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="23.5001" y="81.5001" width="1234" height="592" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide21--20" /></g></svg>