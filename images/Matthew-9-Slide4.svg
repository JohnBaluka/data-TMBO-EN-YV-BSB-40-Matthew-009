-Picture_4--Slide4--1)" transform="matrix(1 0 0 1.00367 -0.5 0)"><use width="100%" height="100%" xlink:href="#img1--Picture_4--Slide4--1" transform="scale(8580.83 8580.83)"></use></g></g><g clip-path="url(#clip3--Picture_8--Slide4--2)" transform="matrix(0.000104987 0 0 0.000104987 650 108)" id="Picture_8--Slide4--2" class="fragment-off" data-fragment-index="1"><g clip-path="url(#clip5--Picture_8--Slide4--2)" transform="matrix(1 0 0 1.00205 -0.5 0)"><use width="100%" height="100%" xlink:href="#img4--Picture_8--Slide4--2" transform="scale(8594.72 8594.72)"></use></g></g><rect x="0" y="0" width="1280" height="67" fill="#7030A0" id="TitlePlaceholder--Slide4--3" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="42.6667" transform="translate(9.6 46)" id="TitlePlaceholder--Slide4--4">Jesus Heals a Paralytic</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1190.37 27)" id="SectionNameTextPlaceholder--Slide4--5">Matthew 9</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7672 189)" id="TextBox_7--Slide4--6">6</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 196)" id="TextBox_8--Slide4--7">But so that you may know that the Son of Man has</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 230)" id="TextBox_8--Slide4--8">authority on earth to forgive sins...”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 263)" id="TextBox_8--Slide4--9">Then He said to the paralytic,</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(390.46 263)" id="TextBox_8--Slide4--10">“Get up, pick up your</text><text fill="#C00000" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 297)" id="TextBox_8--Slide4--11">mat, and go home.”</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7672 368)" id="TextBox_11--Slide4--12" class="fragment-off" data-fragment-index="1">7</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52 377)" id="TextBox_12--Slide4--13" class="fragment-off" data-fragment-index="1">And the man got up and went home.</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(29.7672 462)" id="TextBox_13--Slide4--14" class="fragment-off" data-fragment-index="2">8</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 470)" id="TextBox_14--Slide4--15" class="fragment-off" data-fragment-index="2">When the crowds saw this, they were filled with</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 504)" id="TextBox_14--Slide4--16" class="fragment-off" data-fragment-index="2">awe and glorified God, who had given such</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(52.0001 537)" id="TextBox_14--Slide4--17" class="fragment-off" data-fragment-index="2">authority to men.</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(18.487 709)" id="ReferenceTextPlaceholder--Slide4--18">Matthew 9:6</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(107.34 709)" id="ReferenceTextPlaceholder--Slide4--19">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(115.84 709)" id="ReferenceTextPlaceholder--Slide4--20">8 · Berean Standard Bible (BSB)</text><rect x="649.5" y="108.5" width="619" height="520" stroke="#8064A2" stroke-width="1.33333" stroke-miterlimit="8" fill="none" id="ViewBox--Slide4--21" class="fragment-off" data-fragment-index="2" /><g clip-path="url(#clip6--Picture_19--Slide4--22)" transform="matrix(0.000104987 0 0 0.000104987 650 107)" id="Picture_19--Slide4--22" class="fragment-off" data-fragment-index="2"><g clip-path="url(#clip8--Picture_19--Slide4--22)" transform="matrix(1 0 0 1.00205 -0.5 0)"><use width="100%" height="100%" xlink:href="#img7--Picture_19--Slide4--22" transform="scale(8594.72 8594.72)"></use></g></g><a id="Narration_Slide4--Slide4--23__LINK" href=""><g clip-path="url(#clip9--Narration_Slide4--Slide4--23)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide4--Slide4--23" style="display:none;"><g clip-path="url(#clip11--Narration_Slide4--Slide4--23)"><use width="100%" height="100%" xlink:href="#img10--Narration_Slide4--Slide4--23" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>