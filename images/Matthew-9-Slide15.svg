er--Slide16--1" /><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="300" font-size="34" transform="translate(9.6 43)" id="TitlePlaceholder--Slide16--2">Jesus Heals the Blind and Mute</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="18" transform="translate(1190.37 27)" id="SectionNameTextPlaceholder--Slide16--3">Matthew 9</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(39.0546 218)" id="TextBox_7--Slide16--4">32</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 218)" id="TextBox_8--Slide16--5">As they were leaving, a demon</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(419.473 218)" id="TextBox_8--Slide16--6">-</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(427.973 218)" id="TextBox_8--Slide16--7">possessed man</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 252)" id="TextBox_8--Slide16--8">who was mute was brought to Jesus.</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(39.0546 331)" id="TextBox_9--Slide16--9" class="fragment-off" data-fragment-index="1">33</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 330)" id="TextBox_10--Slide16--10" class="fragment-off" data-fragment-index="1">And when the demon had been driven out, the</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 364)" id="TextBox_10--Slide16--11" class="fragment-off" data-fragment-index="1">man began to speak. The crowds were amazed</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 397)" id="TextBox_10--Slide16--12" class="fragment-off" data-fragment-index="1">and said, “Nothing like this has ever been seen</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 431)" id="TextBox_10--Slide16--13" class="fragment-off" data-fragment-index="1">in Israel!”</text><text fill="#8064A2" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(39.0546 503)" id="TextBox_12--Slide16--14" class="fragment-off" data-fragment-index="2">34</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 502)" id="TextBox_13--Slide16--15" class="fragment-off" data-fragment-index="2">But the Pharisees said, “It is by the prince of</text><text font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(71.4198 536)" id="TextBox_13--Slide16--16" class="fragment-off" data-fragment-index="2">demons that He drives out demons.”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide16--17">Matthew 9:32</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide16--18">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide16--19">34 · Berean Standard Bible (BSB)</text><a id="Narration_Slide16--Slide16--20__LINK" href=""><g clip-path="url(#clip0--Narration_Slide16--Slide16--20)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide16--Slide16--20" style="display:none;"><g clip-path="url(#clip2--Narration_Slide16--Slide16--20)"><use width="100%" height="100%" xlink:href="#img1--Narration_Slide16--Slide16--20" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a><rect x="649.5" y="169.5" width="616" height="411" stroke="#8064A2" s