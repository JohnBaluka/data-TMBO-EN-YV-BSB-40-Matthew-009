gle_6--Slide16--5" /><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 317)" id="TextBox_7--Slide16--6">32</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 316)" id="TextBox_8--Slide16--7">As they were leaving, a demon</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(448.053 316)" id="TextBox_8--Slide16--8">-</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(456.553 316)" id="TextBox_8--Slide16--9">possessed man who was mute was brought to Jesus.</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 367)" id="TextBox_9--Slide16--10" class="fragment-off" data-fragment-index="1">33</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 366)" id="TextBox_10--Slide16--11" class="fragment-off" data-fragment-index="1">And when the demon had been driven out, the man began to speak. The crowds</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 402)" id="TextBox_11--Slide16--12" class="fragment-off" data-fragment-index="1">were amazed and said, “Nothing like this has ever been seen in Israel!”</text><text fill="#C6AFE4" font-family="Carlito,sans-serif" font-weight="400" font-size="20" transform="translate(67.5933 453)" id="TextBox_12--Slide16--13" class="fragment-off" data-fragment-index="2">34</text><text fill="#FFFFFF" font-family="Carlito,sans-serif" font-weight="400" font-size="28" transform="translate(100 452)" id="TextBox_13--Slide16--14" class="fragment-off" data-fragment-index="2">But the Pharisees said, “It is by the prince of demons that He drives out demons.”</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(16.4 710)" id="ReferenceTextPlaceholder--Slide16--15">Matthew 9:32</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(113.92 710)" id="ReferenceTextPlaceholder--Slide16--16">–</text><text fill="#4F81BD" font-family="Carlito,sans-serif" font-weight="400" font-size="17" transform="translate(122.42 710)" id="ReferenceTextPlaceholder--Slide16--17">34 · Berean Standard Bible (BSB)</text><a id="Narration_Slide16--Slide16--18__LINK" href=""><g clip-path="url(#clip3--Narration_Slide16--Slide16--18)" transform="matrix(0.000104987 0 0 0.000104987 1200 640)" id="Narration_Slide16--Slide16--18" style="display:none;"><g clip-path="url(#clip5--Narration_Slide16--Slide16--18)"><use width="100%" height="100%" xlink:href="#img4--Narration_Slide16--Slide16--18" transform="matrix(9525 0 0 9525 -1 -0.5)"></use></g></g></a></g></svg>